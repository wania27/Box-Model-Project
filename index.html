<!DOCTYPE html>
<html>

<head>
    <title>My Fitness Routine</title>
    <style>
        body {
            background-color: whitesmoke;
            font-family: Arial;
            text-align: center;
        }

        div {
            background-color: white;
            border: 2px solid teal;
            margin: 12px auto;
            padding: 10px;
            width: 300px;
        }

        h2 {
            color: darkblue;
        }

    </style>
</head>
<body>

    <h1>My Fitness Routine</h1>

    <div>
        <h2>Warm-Up</h2>
        <p>Walk gently to prepare your body for physical activity.</p>
    </div>

    <div>
        <h2>Outdoor Fun</h2>
        <p>Play football or ride a bicycle with your friends.</p>
    </div>

    <div>
        <h2>Healthy Eating</h2>
        <p>Eat and enjoy fruits, vegetables, and balanced meals.</p>
    </div>

    <div>
        <h2>Relaxation</h2>
        <p>Stretch gently every day and got enough sleep every night.</p>
    </div>

</body>

</html>
